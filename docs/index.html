<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stocks Desk — carstoiuc.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-ink: #0B0F14;
    --panel: #131922;
    --panel-border: #232B38;
    --text-primary: #E7E9EE;
    --text-muted: #7C8797;
    --accent-gain: #3FCB93;
    --accent-loss: #FF5C72;
    --accent-gold: #E3AE4B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-ink);
    color: var(--text-primary);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
  }

  @media (prefers-reduced-motion: reduce) {
    .tape-track { animation: none !important; }
  }

  /* ---- Ticker tape (signature element) ---- */
  .tape {
    overflow: hidden;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel);
    white-space: nowrap;
    position: relative;
  }
  .tape-track {
    display: inline-flex;
    animation: scroll-tape 30s linear infinite;
    padding: 0.6rem 0;
  }
  .tape-item {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    padding: 0 1.75rem;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .tape-item strong {
    color: var(--text-primary);
    font-weight: 600;
    margin-right: 0.5rem;
  }
  .tape-item.gain { color: var(--accent-gain); }
  .tape-item.loss { color: var(--accent-loss); }

  @keyframes scroll-tape {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-gold);
    margin: 0 0 0.75rem;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 2.75rem);
    font-weight: 700;
    margin: 0 0 0.5rem;
    letter-spacing: -0.01em;
  }

  .subhead {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0 0 3rem;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1px;
    background: var(--panel-border);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 3rem;
  }

  .card {
    background: var(--panel);
    padding: 1.25rem 1.4rem;
  }

  .card .ticker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }

  .card .price {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0.35rem 0 0.2rem;
  }

  .card .change {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    font-weight: 500;
  }
  .card .change.gain { color: var(--accent-gain); }
  .card .change.loss { color: var(--accent-loss); }

  .card.alerted {
    box-shadow: inset 0 0 0 1px var(--accent-gold);
  }

  section h2 {
    font-size: 1rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin: 0 0 1rem;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
  }

  th {
    text-align: left;
    font-weight: 500;
    color: var(--text-muted);
    border-bottom: 1px solid var(--panel-border);
    padding: 0.6rem 0.75rem;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  td {
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid var(--panel-border);
    color: var(--text-primary);
  }

  tr:last-child td { border-bottom: none; }

  .gain { color: var(--accent-gain); }
  .loss { color: var(--accent-loss); }
  .flag { color: var(--accent-gold); }

  .empty {
    color: var(--text-muted);
    font-size: 0.9rem;
    padding: 2rem;
    text-align: center;
    border: 1px dashed var(--panel-border);
    border-radius: 10px;
  }

  footer {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
    color: var(--text-muted);
    font-size: 0.8rem;
    font-family: 'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>

  <div class="tape">
    <div class="tape-track" id="tapeTrack">
      <span class="tape-item">Loading…</span>
    </div>
  </div>

  <main>
    <p class="eyebrow">carstoiuc.org · personal watchlist</p>
    <h1>Stocks Desk</h1>
    <p class="subhead" id="lastUpdated">Waiting for the first check…</p>

    <div class="cards" id="cards"></div>

    <section>
      <h2>Recent checks</h2>
      <div id="historyWrap"></div>
    </section>
  </main>

  <footer>
    Checked hourly, 9:30–16:00 ET, Mon–Fri. Alerts trigger on moves ≥ threshold from previous close.
  </footer>

<script>
async function loadData() {
  let history = [];
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    history = await res.json();
  } catch (e) {
    document.getElementById('lastUpdated').textContent = "Couldn't load data.json yet.";
    return;
  }

  if (!history.length) {
    document.getElementById('lastUpdated').textContent = 'No checks logged yet — the first run happens within the hour.';
    document.getElementById('cards').innerHTML = '';
    document.getElementById('historyWrap').innerHTML = '<div class="empty">Nothing here yet. Once the hourly workflow runs, checks will show up in this space.</div>';
    document.getElementById('tapeTrack').innerHTML = '<span class="tape-item">Awaiting first check…</span>';
    return;
  }

  const latest = history[history.length - 1];
  const updatedDate = new Date(latest.timestamp);
  document.getElementById('lastUpdated').textContent =
    'Last checked ' + updatedDate.toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) + ' ET';

  // ---- Ticker cards (latest snapshot) ----
  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = latest.tickers.map(t => {
    const dir = t.pct_change > 0 ? 'gain' : t.pct_change < 0 ? 'loss' : '';
    const sign = t.pct_change > 0 ? '+' : '';
    return `<div class="card ${t.alert ? 'alerted' : ''}">
      <div class="ticker">${t.ticker}</div>
      <div class="price">$${t.price?.toFixed(2) ?? '—'}</div>
      <div class="change ${dir}">${sign}${t.pct_change?.toFixed(2) ?? '—'}%</div>
    </div>`;
  }).join('');

  // ---- Ticker tape (loop the content twice for a seamless scroll) ----
  const tapeItems = latest.tickers.map(t => {
    const dir = t.pct_change > 0 ? 'gain' : t.pct_change < 0 ? 'loss' : '';
    const sign = t.pct_change > 0 ? '+' : '';
    return `<span class="tape-item ${dir}"><strong>${t.ticker}</strong>$${t.price?.toFixed(2) ?? '—'} (${sign}${t.pct_change?.toFixed(2) ?? '—'}%)</span>`;
  }).join('');
  document.getElementById('tapeTrack').innerHTML = tapeItems + tapeItems;

  // ---- History table (most recent first, flattened per ticker, capped for display) ----
  const rows = [];
  for (let i = history.length - 1; i >= 0 && rows.length < 60; i--) {
    const entry = history[i];
    const time = new Date(entry.timestamp).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    for (const t of entry.tickers) {
      const dir = t.pct_change > 0 ? 'gain' : t.pct_change < 0 ? 'loss' : '';
      const sign = t.pct_change > 0 ? '+' : '';
      rows.push(`<tr>
        <td>${time}</td>
        <td>${t.ticker}</td>
        <td>$${t.price?.toFixed(2) ?? '—'}</td>
        <td class="${dir}">${sign}${t.pct_change?.toFixed(2) ?? '—'}%</td>
        <td class="${t.alert ? 'flag' : ''}">${t.alert ? '● alert' : '—'}</td>
      </tr>`);
    }
  }

  document.getElementById('historyWrap').innerHTML = `
    <table>
      <thead>
        <tr><th>Time</th><th>Ticker</th><th>Price</th><th>Change</th><th>Flag</th></tr>
      </thead>
      <tbody>${rows.join('')}</tbody>
    </table>`;
}

loadData();
</script>

</body>
</html>
