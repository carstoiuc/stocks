name: Hourly Stock Check

on:
  schedule:
    # Runs at minute 0 of every hour, 13:00-21:00 UTC, Mon-Fri.
    # This window covers 9am-5pm ET across both EST (UTC-5) and EDT (UTC-4),
    # with a bit of buffer on each side. main.py itself checks the exact
    # NYSE open/close time and skips the run if the market is actually closed,
    # so the buffer here is harmless.
    - cron: '0 13-21 * * 1-5'
  workflow_dispatch: {}  # lets you manually trigger a run from the Actions tab, for testing

jobs:
  check-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock check
        env:
          TICKERS: ${{ secrets.TICKERS }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MOVE_THRESHOLD_PCT: ${{ secrets.MOVE_THRESHOLD_PCT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python main.py
